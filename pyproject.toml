[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datadoctor"
version = "2.1.0"
description = "Agent-Ready Multi-View Label-Error Detection, Hygiene & Disagreement-Routed Repair"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prateek Khemka" },
    { name = "Nikhil" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
baselines = [
    "cleanlab>=2.5.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
ui = [
    "streamlit>=1.30.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datadoctor*"]

